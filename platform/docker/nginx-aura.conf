# Auratel vhosts for a host nginx that also serves other sites.
#
#   sudo cp docker/nginx-aura.conf /etc/nginx/sites-available/aura
#   sudo ln -s /etc/nginx/sites-available/aura /etc/nginx/sites-enabled/aura
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d auratel.sirahdigital.in \
#                        -d aura.sirahagents.com -d storage.aura.sirahagents.com \
#                        -d sirahagents.com -d www.sirahagents.com
#
# ── THE TWO HOSTS, AND WHY BOTH EXIST (cutover 2026-10-14) ──────────────────
#
# PRIMARY:  auratel.sirahdigital.in   - the brand domain. Serves all three
#                                       surfaces: / marketing, /admin console,
#                                       /v1 API. This is the address to give
#                                       anyone from now on.
#
# LEGACY:   aura.sirahagents.com      - CANNOT BE RETIRED, EVER. Every handset
#                                       enrolled before this cutover stored
#                                       that hostname in its own prefs
#                                       (ActivationStore.kt) and uploads
#                                       recordings to /v1 on it. Phones in the
#                                       field cannot be re-pointed remotely, so
#                                       deleting this block silently stops
#                                       recordings arriving - no error anywhere
#                                       except a quiet drop in call volume.
#
# The legacy block therefore keeps /v1 AND the console paths proxying, and
# redirects only the marketing root. The console is deliberately NOT redirected:
# a 301 turns an in-flight Server Action POST into a GET, so an owner mid-session
# would watch a save do nothing and report no error. Bookmarks keep working;
# nothing new points there.
#
# ── BEFORE ENABLING THE MARKETING VHOST, READ THIS ──────────────────────────
#
# The apex `sirahagents.com` is ALREADY SERVING SOMETHING — as of 2026-08-09 it
# returns a generic 404 page from another stack on this box, and
# `www.sirahagents.com` does not resolve at all. So the marketing block below
# will collide with an existing server block unless you find and remove it.
#
#   grep -rn "sirahagents.com" /etc/nginx/sites-enabled/
#
# nginx resolves duplicate server_names by taking the FIRST one loaded, which is
# alphabetical by filename in sites-enabled. A file named `000-default` wins over
# `aura` silently: nginx -t passes, reload succeeds, and the apex keeps serving
# the old site. Check with `curl -sI https://sirahagents.com` after reloading,
# not with the exit code of the reload.
#
# `www` also needs a DNS A record pointing at this box before certbot can issue
# for it; certbot will fail the challenge otherwise and leave the vhost on :80.
#
# Deliberately HTTP-only: certbot --nginx rewrites these blocks in place to add
# listen 443 ssl + the certificate paths + the :80 redirect. Shipping 443 blocks
# up front would reference cert files that don't exist yet and nginx would
# refuse to start.
#
# Upstreams are the loopback ports published by docker-compose.nginx.yml.

upstream aura_api  { server 127.0.0.1:18081; keepalive 16; }
upstream aura_web  { server 127.0.0.1:18080; keepalive 16; }
upstream aura_minio { server 127.0.0.1:18082; keepalive 16; }
upstream aura_marketing { server 127.0.0.1:18083; keepalive 16; }
# The self-hosted Supabase gateway (Envoy), published on loopback by
# supabase/selfhost/docker-compose.aura.yml. It belongs to the SEPARATE
# `aura-supabase` compose project, not to docker-compose.nginx.yml - so
# deploy.sh does not check this port and will not fail if the stack is down.

# ── Console + API + marketing: THE PRIMARY HOST ──────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name auratel.sirahdigital.in;

    # Console uploads are small; the device upload path is the storage vhost.
    client_max_body_size 32m;

    # Supabase stores the session JWT in cookies and CHUNKS it across several
    # (sb-<ref>-auth-token.0, .1, ...). A console user with a long-lived session
    # sends all of them on every request, and nginx's DEFAULT of `4 8k` rejects
    # the lot with "400 Bad Request - Request Header Or Cookie Too Large"
    # before the request reaches the app.
    #
    # That failure is nastier than it sounds: it is per-browser, so the site
    # looks completely down to the person holding the big cookie while curl and
    # every health check report it perfectly healthy. Production hit it on
    # 2026-09-30.
    large_client_header_buffers 8 32k;

    # /v1/* is the API. ^~ so this wins over any regex location another config
    # might introduce.
    location ^~ /v1/ {
        proxy_pass http://aura_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 300s;
    }

    # "Continue with Google" (migration 0137). GoTrue's two OAuth endpoints, and
    # NOTHING else from the private Supabase stack: the browser is sent to
    # /auth/v1/authorize, and Google returns it to /auth/v1/callback. Exact
    # matches, so /auth/v1/token and /auth/v1/admin/... stay unreachable.
    #
    # BOTH vhosts carry these, for different reasons. Here, because the console
    # served on this host starts the flow from its own origin. On the legacy
    # host, because GOOGLE_REDIRECT_URI is registered VERBATIM in Google Cloud
    # and still names that hostname - so Google returns the browser there, and
    # GoTrue then forwards it to whichever console origin asked, which has to be
    # in ADDITIONAL_REDIRECT_URLS (supabase/selfhost/.env.selfhost).
    #
    # THIS BLOCK WAS MISSING FROM THIS FILE until 2026-10-14, while the live
    # /etc/nginx/sites-enabled/aura had it. Copying this file over the live one
    # would have silently removed Google sign-in. Keep them in step.
    location = /auth/v1/authorize {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:18084;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    location = /auth/v1/callback {
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:18084;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # The console, under /admin - the Next basePath (apps/web/next.config.ts).
    # `^~` so it wins over the marketing root below without depending on block
    # order.
    location ^~ /admin {
        proxy_pass http://aura_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 300s;
    }

    # THE ADDRESS CUSTOMERS ARE GIVEN. The console is mounted at /admin, but
    # that prefix is an artefact of sharing this host with the marketing site,
    # and it is not something to hand to a client - so exactly one path is
    # carved out of the marketing root and pointed at the console's own sign-in
    # page. `=` keeps the carve-out to this single URL: /login-anything-else
    # still belongs to marketing.
    #
    # Nothing else needs a rule. The page it returns asks for its assets at
    # /admin/_next/... and posts its sign-in Server Action back to /login, both
    # of which land on the console through this block or the one above; after a
    # successful sign-in Next redirects to /admin/dashboard, so the prefix
    # reappears only once the customer is inside.
    #
    # KEEP THIS IN STEP WITH apps/web/app/(platform)/instances/sign-in-link.tsx,
    # which prints this URL for operators to send. That component drops the
    # basePath deliberately; if this block goes away it prints a 404.
    location = /login {
        proxy_pass http://aura_web/admin/login;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 300s;
    }

    # A trailing slash is the same request to a human. Redirect rather than a
    # second proxy block, so there is one canonical sign-in URL.
    location = /login/ {
        return 301 /login;
    }

    # Everything else on this host is the public marketing site.
    location / {
        proxy_pass http://aura_marketing;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 300s;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
}

# ── LEGACY HOST: the handset upload path. DO NOT DELETE ──────────────────────
#
# Read the cutover note in the file header first. Short version: phones enrolled
# before 2026-10-14 POST their recordings to /v1 on THIS name and there is no
# remote way to move them, so this block outlives the brand.
#
# It is a near-copy of the primary block rather than a `server_name` alias on it
# because the two hosts do different jobs now: this one is a compatibility
# surface for existing clients, the other is the address we publish. Keeping
# them separate is what lets the marketing root 301 here while /v1 does not.
server {
    listen 80;
    listen [::]:80;
    server_name aura.sirahagents.com;

    client_max_body_size 32m;
    # Same chunked-Supabase-cookie reason as the primary block - a console user
    # still signing in here holds the same oversized cookie.
    large_client_header_buffers 8 32k;

    # THE LOAD-BEARING LOCATION. Every handset in the field depends on it.
    location ^~ /v1/ {
        proxy_pass http://aura_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 300s;
    }

    # Google's registered return address. GOOGLE_REDIRECT_URI in
    # supabase/selfhost/.env.selfhost names THIS host, and it is registered
    # verbatim in Google Cloud - so every Google sign-in, including one started
    # on the primary host, comes back through here. Changing it is a Google
    # Cloud change, not an nginx one, which is why it was left alone.
    location = /auth/v1/authorize {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:18084;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    location = /auth/v1/callback {
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:18084;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # The console keeps answering here for old bookmarks and open sessions. NOT
    # a redirect, deliberately - see the header note about Server Action POSTs.
    location ^~ /admin {
        proxy_pass http://aura_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 300s;
    }

    # The sign-in carve-out, same as the primary host: every link an operator
    # sent a customer before the cutover is this URL on this host.
    location = /login {
        proxy_pass http://aura_web/admin/login;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 300s;
    }

    location = /login/ {
        return 301 /login;
    }

    # The marketing site DOES move. One canonical origin for the public pages,
    # or the brand domain and this one split search ranking between them and
    # disagree with the canonical tags baked into the build.
    location / {
        return 301 https://auratel.sirahdigital.in$request_uri;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
}

# ── Self-hosted Supabase: PRIVATE, serves nothing ────────────────────────────
#
# The Supabase stack is deliberately NOT published (decided 2026-09-24). The
# console talks to GoTrue at http://supabase-gateway:8000 over the Docker
# network (NEXT_PUBLIC_SUPABASE_URL - every auth call runs server-side, none in
# the browser), the API likewise, and Studio / Postgres are reached only through
# an SSH tunnel to 127.0.0.1:18084 / :15432.
#
# The block still has to exist: without it a request for the name falls
# through to nginx's default server and gets ANOTHER site's page back under
# this hostname (it did, before this was added). 443 refuses the TLS handshake,
# so no certificate is ever issued for the name and it never appears in
# Certificate Transparency logs - the usual way crawlers find subdomains. 80
# closes the connection without a response.
#
# If "Continue with Google" is ever enabled, the browser must reach GoTrue's
# /auth/v1/authorize and /auth/v1/callback - publish exactly those two paths
# then, not the whole gateway.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name supabase.aura.sirahagents.com;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name supabase.aura.sirahagents.com;
    access_log off;
    return 444;
}

# ── Object storage (device uploads) ──────────────────────────────────────────
# Phones PUT multipart parts here against presigned URLs the API signs using
# S3_PUBLIC_ENDPOINT. SigV4 covers the Host header, so Host MUST be forwarded
# unchanged — proxy_set_header Host $host is load-bearing, not boilerplate.
#
# DELIBERATELY NOT RENAMED in the 2026-10-14 cutover, and renaming it later is a
# migration rather than an edit. The hostname is part of what S3_PUBLIC_ENDPOINT
# signs: change this name without changing that variable and every signature
# fails, and change both and the presigned URLs already handed to phones - valid
# for their remaining lifetime - start failing instead. Nothing public ever
# shows this address, so there is no brand reason to touch it.
server {
    listen 80;
    listen [::]:80;
    server_name storage.aura.sirahagents.com;

    # Recording parts are multi-MB. nginx defaults to 1m, which would reject
    # every upload with 413; and buffering a large part to disk before
    # forwarding adds latency for no benefit.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;

    location / {
        proxy_pass http://aura_minio;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 30s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }
}

# ── Old marketing origins (apex + www) → the brand domain ────────────────────
#
# These two used to SERVE the marketing site. Since the 2026-10-14 cutover the
# site has exactly one canonical origin, auratel.sirahdigital.in, and these
# redirect to it.
#
# One origin is not tidiness: NEXT_PUBLIC_SITE_URL is baked into the sitemap and
# into every page's canonical tag at BUILD time, so a second origin serving the
# same bundle advertises URLs it is not reachable at. That mismatch needs a
# rebuild to fix, never an nginx edit - which is exactly the trap this avoids.
#
# Read the collision warning in the file header before enabling these: the apex
# is served by another stack on this box, and a `000-default` in sites-enabled
# wins over this file silently.
server {
    listen 80;
    listen [::]:80;
    server_name www.sirahagents.com sirahagents.com;
    return 301 https://auratel.sirahdigital.in$request_uri;
}

# Aura vhosts for a host nginx that also serves other sites.
#
#   sudo cp docker/nginx-aura.conf /etc/nginx/sites-available/aura
#   sudo ln -s /etc/nginx/sites-available/aura /etc/nginx/sites-enabled/aura
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d aura.sirahagents.com -d storage.aura.sirahagents.com \
#                        -d sirahagents.com -d www.sirahagents.com
#
# ── BEFORE ENABLING THE MARKETING VHOST, READ THIS ──────────────────────────
#
# The apex `sirahagents.com` is ALREADY SERVING SOMETHING — as of 2026-08-09 it
# returns a generic 404 page from another stack on this box, and
# `www.sirahagents.com` does not resolve at all. So the marketing block below
# will collide with an existing server block unless you find and remove it.
#
#   grep -rn "sirahagents.com" /etc/nginx/sites-enabled/
#
# nginx resolves duplicate server_names by taking the FIRST one loaded, which is
# alphabetical by filename in sites-enabled. A file named `000-default` wins over
# `aura` silently: nginx -t passes, reload succeeds, and the apex keeps serving
# the old site. Check with `curl -sI https://sirahagents.com` after reloading,
# not with the exit code of the reload.
#
# `www` also needs a DNS A record pointing at this box before certbot can issue
# for it; certbot will fail the challenge otherwise and leave the vhost on :80.
#
# Deliberately HTTP-only: certbot --nginx rewrites these blocks in place to add
# listen 443 ssl + the certificate paths + the :80 redirect. Shipping 443 blocks
# up front would reference cert files that don't exist yet and nginx would
# refuse to start.
#
# Upstreams are the loopback ports published by docker-compose.nginx.yml.

upstream aura_api  { server 127.0.0.1:18081; keepalive 16; }
upstream aura_web  { server 127.0.0.1:18080; keepalive 16; }
upstream aura_minio { server 127.0.0.1:18082; keepalive 16; }
upstream aura_marketing { server 127.0.0.1:18083; keepalive 16; }
# The self-hosted Supabase gateway (Envoy), published on loopback by
# supabase/selfhost/docker-compose.aura.yml. It belongs to the SEPARATE
# `aura-supabase` compose project, not to docker-compose.nginx.yml - so
# deploy.sh does not check this port and will not fail if the stack is down.
upstream aura_supabase { server 127.0.0.1:18084; keepalive 16; }

# ── Console + API ────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name aura.sirahagents.com;

    # Console uploads are small; the device upload path is the storage vhost.
    client_max_body_size 32m;

    # /v1/* is the API. ^~ so this wins over any regex location another config
    # might introduce.
    location ^~ /v1/ {
        proxy_pass http://aura_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 300s;
    }

    # The console, under /admin - the Next basePath (apps/web/next.config.ts).
    # `^~` so it wins over the marketing root below without depending on block
    # order.
    location ^~ /admin {
        proxy_pass http://aura_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 300s;
    }

    # THE ADDRESS CUSTOMERS ARE GIVEN. The console is mounted at /admin, but
    # that prefix is an artefact of sharing this host with the marketing site,
    # and it is not something to hand to a client - so exactly one path is
    # carved out of the marketing root and pointed at the console's own sign-in
    # page. `=` keeps the carve-out to this single URL: /login-anything-else
    # still belongs to marketing.
    #
    # Nothing else needs a rule. The page it returns asks for its assets at
    # /admin/_next/... and posts its sign-in Server Action back to /login, both
    # of which land on the console through this block or the one above; after a
    # successful sign-in Next redirects to /admin/dashboard, so the prefix
    # reappears only once the customer is inside.
    #
    # KEEP THIS IN STEP WITH apps/web/app/(platform)/instances/sign-in-link.tsx,
    # which prints this URL for operators to send. That component drops the
    # basePath deliberately; if this block goes away it prints a 404.
    location = /login {
        proxy_pass http://aura_web/admin/login;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 300s;
    }

    # A trailing slash is the same request to a human. Redirect rather than a
    # second proxy block, so there is one canonical sign-in URL.
    location = /login/ {
        return 301 /login;
    }

    # Everything else on this host is the public marketing site.
    location / {
        proxy_pass http://aura_marketing;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 300s;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
}

# ── Self-hosted Supabase ─────────────────────────────────────────────────────
#
# Add this hostname to the certbot command in the header before enabling:
#   sudo certbot --nginx -d supabase.sirahagents.com ...
#
# The console signs in against https://supabase.sirahagents.com/auth/v1, and the
# API provisions owner logins through the same origin, so this is a real public
# vhost. It must match SUPABASE_PUBLIC_URL in supabase/selfhost/.env.selfhost
# and NEXT_PUBLIC_SUPABASE_URL in .env.production - the JWT issuer and the
# session cookies are both tied to the origin, so a mismatch breaks sign-in in
# ways that look like an auth bug rather than a proxy one.
#
# WHAT IS BEHIND THIS: the whole Supabase API surface, including Studio at /.
# Studio has no login of its own; the gateway's basic auth (DASHBOARD_USERNAME /
# DASHBOARD_PASSWORD) is the only thing in front of a SQL console over every
# tenant's data. supabase/selfhost/bin/verify-selfhost.sh asserts / returns 401
# and that the anon key cannot read tenant tables - run it after any change here.
server {
    listen 80;
    listen [::]:80;
    server_name supabase.sirahagents.com;

    # Storage uploads go through this host. Aura does not use Supabase Storage
    # (recordings go to MinIO on the storage vhost below), but leaving the
    # default 1m here would make the endpoint fail confusingly if it ever is.
    client_max_body_size 64m;

    location / {
        proxy_pass http://aura_supabase;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Realtime is a websocket endpoint. Unused by Aura today, but a proxy
        # that silently cannot upgrade is a bad thing to debug later.
        #
        # Passing $http_connection through, rather than the usual
        # `map $http_upgrade $connection_upgrade`: this box's nginx serves other
        # sites, and a second `map` of that name anywhere in the http context is
        # a hard "duplicate map" error that takes every vhost down, not just
        # this one. Forwarding the client's own Connection header upgrades when
        # the client asked to and does nothing when it did not.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $http_connection;
        proxy_read_timeout 300s;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
}

# ── Object storage (device uploads) ──────────────────────────────────────────
# Phones PUT multipart parts here against presigned URLs the API signs using
# S3_PUBLIC_ENDPOINT. SigV4 covers the Host header, so Host MUST be forwarded
# unchanged — proxy_set_header Host $host is load-bearing, not boilerplate.
server {
    listen 80;
    listen [::]:80;
    server_name storage.aura.sirahagents.com;

    # Recording parts are multi-MB. nginx defaults to 1m, which would reject
    # every upload with 413; and buffering a large part to disk before
    # forwarding adds latency for no benefit.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;

    location / {
        proxy_pass http://aura_minio;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 30s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }
}

# ── Public marketing site (apex + www) ───────────────────────────────────────
# Unauthenticated, internet-facing, and a different container from the console —
# see docker/marketing.Dockerfile. Read the collision warning in the header
# before enabling this: the apex is currently served by something else on this
# box.
#
# www redirects to the apex rather than both serving. Two origins serving
# identical content splits search ranking and makes the canonical tag in the
# pages disagree with the URL people actually land on. NEXT_PUBLIC_SITE_URL must
# match whichever one wins — it is baked into the sitemap and the canonicals at
# build time, so a mismatch needs a rebuild, not an nginx edit.
server {
    listen 80;
    listen [::]:80;
    server_name www.sirahagents.com;
    return 301 https://sirahagents.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name sirahagents.com;

    # The enquiry form posts a few hundred bytes. Anything larger is not a
    # legitimate request to this site.
    client_max_body_size 1m;

    location / {
        proxy_pass http://aura_marketing;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The funnel rate-limits on a salted hash of the client IP. Without this
        # header every visitor arrives as the container gateway address, so the
        # whole internet shares one rate-limit bucket and the first few
        # submissions lock everyone else out.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
}

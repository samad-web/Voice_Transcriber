# Production stack for a single VPS. Everything is behind Caddy, which is the
# only container binding a host port and which obtains/renews Let's Encrypt
# certificates automatically.
#
#   cp .env.production.example .env.production   # then fill it in
#   docker compose --env-file .env.production -f docker-compose.prod.yml --profile setup run --rm migrate
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# --env-file is REQUIRED, not decorative: `env_file:` only populates the
# containers, while ${VAR} substitution in THIS file reads the --env-file (or a
# plain .env). Omit it and APP_DOMAIN et al resolve empty and the stack refuses
# to start.
#
# Postgres is NOT here — the database is Supabase (see DEPLOYMENT.md §2).
# Redis, RabbitMQ and MinIO stay local to the box and are never published.

name: aura

x-node-image: &node-image
  build:
    context: .
    dockerfile: docker/node.Dockerfile
  image: aura-node:latest
  env_file: .env.production
  restart: unless-stopped

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Consumed by docker/Caddyfile; both must have A/AAAA records pointing here
      # BEFORE first start or the ACME challenge fails.
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env.production}
      STORAGE_DOMAIN: ${STORAGE_DOMAIN:?set STORAGE_DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.production}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # certificates — losing this re-issues (rate limits!)
      - caddy_config:/config
    depends_on:
      - api
      - web
      - minio

  api:
    <<: *node-image
    command: ["node", "apps/api/dist/main.js"]
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *node-image
    command: ["node", "apps/worker/dist/main.js"]
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        # Inlined into the client bundle at build time — changing any of these
        # needs a rebuild, not a restart.
        NEXT_PUBLIC_API_URL: https://${APP_DOMAIN}
        # The console is served under /admin, because the marketing site now
        # holds the root of this same host. Next bakes this into every link,
        # every Server Action endpoint and every /_next/static asset URL, so it
        # is a BUILD arg — a restart with it changed does nothing.
        #
        # Defaults to /admin. Set it to an empty string to serve the console at
        # the root again, which is what a deployment without a marketing site
        # would want.
        NEXT_PUBLIC_BASE_PATH: ${CONSOLE_BASE_PATH-/admin}
        # Supabase Auth — omit and the console ships with sign-in disabled.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    image: aura-web:latest
    env_file: .env.production
    restart: unless-stopped
    environment:
      # Server components talk to the API over the compose network, skipping
      # the public hop (and the TLS handshake) entirely.
      API_URL: http://api:4000
    depends_on:
      - api

  # The public marketing site. Separate image, separate container, separate
  # credential from the console — see docker/marketing.Dockerfile for why.
  marketing:
    build:
      context: .
      dockerfile: docker/marketing.Dockerfile
      args:
        # Baked into the bundle: canonical URLs, Open Graph tags, sitemap.xml.
        # A wrong value here ships a sitemap advertising the wrong origin, and
        # only a rebuild fixes it.
        NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-}
        # Meta Pixel and Google Tag Manager. Unset means neither loads and the
        # Lead event is a no-op, which is what preview and local builds want.
        # Both fire on page load with no consent prompt (owner's decision,
        # 2026-08-09) — see the note in components/meta-pixel.tsx.
        NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID:-}
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
    image: aura-marketing:latest
    restart: unless-stopped
    # ── DELIBERATELY NOT `env_file: .env.production` ──────────────────────
    #
    # Every other service here loads that file wholesale. This one must not:
    # it holds ADMIN_API_KEY (a cross-tenant root credential), the Supabase
    # service-role key, the S3 secret and the Evolution API key — none of
    # which this container has any use for.
    #
    # This is the one container serving unauthenticated traffic from the open
    # internet, so it gets an explicit allowlist instead. The point of running
    # the funnel on a narrow `aura_marketing` role is to bound what a
    # compromise yields; handing the same container the root admin key would
    # throw that away for the convenience of one less line of YAML.
    environment:
      # Connects as `aura_marketing`: USAGE on the marketing schema only, no
      # access to `public`, NOBYPASSRLS, no DELETE. Not the app's DATABASE_URL.
      FUNNEL_DATABASE_URL: ${FUNNEL_DATABASE_URL}
      # Signs the two-hour funnel session cookie that carries step 1 into step 2.
      FUNNEL_COOKIE_SECRET: ${FUNNEL_COOKIE_SECRET}
      # Salts the one-way IP hash used for rate limiting. Rotating it resets
      # every rate-limit window, which is a nuisance, not a breach.
      FUNNEL_HASH_SALT: ${FUNNEL_HASH_SALT}
      # Supabase requires TLS; ssl.js turns it on for any non-loopback host.
      DB_SSL: ${DB_SSL:-1}
      # ── Google Calendar ────────────────────────────────────────────────
      # Without all three, getScheduler() returns UnavailableScheduler and a
      # booking is recorded in the database but never mirrored to a calendar —
      # which is silent, because the visitor still gets a valid confirmation.
      # The private key is a real secret and the only one here that is not a
      # database credential; it is scoped to one calendar, not the Workspace.
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_SERVICE_ACCOUNT_EMAIL:-}
      GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY:-}
      # Optional, and the difference between an event on the team's calendar and
      # an event the LEAD is actually invited to — a service account cannot add
      # attendees without domain-wide delegation acting as a real mailbox.
      GOOGLE_CALENDAR_IMPERSONATE_SUBJECT: ${GOOGLE_CALENDAR_IMPERSONATE_SUBJECT:-}
      # Booking slot generation defaults. All optional.
      SCHEDULER_TIMEZONE: ${SCHEDULER_TIMEZONE:-Asia/Kolkata}
      SCHEDULER_SLOT_MINUTES: ${SCHEDULER_SLOT_MINUTES:-}
      SCHEDULER_DAY_START: ${SCHEDULER_DAY_START:-}
      SCHEDULER_DAY_END: ${SCHEDULER_DAY_END:-}
      SCHEDULER_WEEKDAYS: ${SCHEDULER_WEEKDAYS:-}
      SCHEDULER_MIN_NOTICE_MINUTES: ${SCHEDULER_MIN_NOTICE_MINUTES:-}
      SCHEDULER_MAX_SLOTS: ${SCHEDULER_MAX_SLOTS:-}
    # No `depends_on`. The marketing site does not call the API, and a content
    # page that will not start because a worker is unhealthy is a marketing
    # outage caused by something the visitor cannot see.

  # One-shot: applies packages/db/migrations to Supabase, then sets the runtime
  # role's password from APP_DB_PASSWORD. Never runs as part of `up`.
  migrate:
    <<: *node-image
    profiles: ["setup"]
    restart: "no"
    command:
      - sh
      - -c
      - "node packages/db/migrate.js && node packages/db/bootstrap-role.js"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redisdata:/data

  rabbitmq:
    image: rabbitmq:3-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 30s

  # Call audio. Kept on-box (encrypted at rest by the app before upload) rather
  # than in Supabase Storage, because the device uploads use S3 multipart
  # presigned URLs that the API signs directly.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY"; do sleep 2; done
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set none "local/$$S3_BUCKET"
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-aura-recordings}

volumes:
  caddy_data:
  caddy_config:
  redisdata:
  rabbitdata:
  miniodata:

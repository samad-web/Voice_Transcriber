# Minimal Supabase CLI config so `supabase link` + `supabase db push` work
# against supabase/migrations (generated by scripts/sync-supabase-migrations.js).
#
# SCOPE OF THIS FILE: the Supabase CLI only, for `supabase db push` against
# supabase/migrations. It has nothing to do with the self-hosted stack that runs
# in production - that is supabase/selfhost/, configured by its own
# .env.selfhost and docker-compose.aura.yml.
#
# This project uses Supabase for Postgres and Auth. It does NOT use Realtime,
# Storage or PostgREST: tenancy is our own RLS on current_setting('app.org_id'),
# enforced through the non-superuser `aura_app` role, so the Data API is left
# switched off and 0007_supabase_hardening.sql revokes anon/authenticated access.
#
# `[auth] enabled = false` below is therefore about the CLI's LOCAL dev stack,
# not a statement that the platform has no auth - the console signs in against
# GoTrue (apps/web/lib/supabase), and apps/api provisions owner logins through
# its admin API.
#
# If the CLI rejects this file after a version bump, run `supabase init` in a
# scratch directory and copy its config.toml over - only project_id and the
# disabled services below matter to us.

project_id = "aura-platform"

[api]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = false

[auth]
enabled = false

[storage]
enabled = false

[realtime]
enabled = false
